name: Admin

on:
  push:
    branches: [ main ]
    pull_request: [ main ]
    paths:
      - 'admin/**'
  workflow_dispatch: #

jobs:
  vue-test: 
    name: Vue Tests & Lint
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci
      
      - name: Build Shared Types
        run: npm run build:types --workspace=@theater/shared 

      - name: Lint
        run: npm run lint:admin-vue 

      - name: Test
        run: npm run test:vue --reporter=verbose

      - name: Upload Vue Results
        uses: actions/upload-artifact@v7
        if: always()
        with: 
          name: test-results
          path: | 
            admin/vue/dist/
            admin/vue/coverage/

# Update later to make a build on any v_._._ relese 
# using tauri-apps/tauri-action@v0.6.2 (latest May 4/25)
  rust-tests:
    name: Rust Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      
      - name: Install Tauri System Dependancies
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        working-directory: src-tauri
        run: cd && cargo fmt --check

      - name: Clippy lint
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test


      - name: Upload Tauri Results
        uses: actions/upload-artifact@v7
        if: always()
        with: 
          name: test-results
          path: | 
            admin/tauri/dist/
            admin/tauri/coverage/