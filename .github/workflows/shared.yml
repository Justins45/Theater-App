# shared.yml — only runs when shared/ changes
name: Shared

on:
  push:
    branches: [main]
    pull_request: [main]
    paths:
      - "shared/**"
  workflow_dispatch: #

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: CHeckout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build:types --workspace=@theater/shared

      - name: Lint
        run: npm run lint:shared

      - name: Test
        run: npm run test:vue --reporter=verbose

      - name: Upload Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            shared/dist/
            shared/coverage/
