# frontend.yml — only runs when frontend/ changes
name: Frontend

on:
  push:
    branches: [ main ]
    pull_request: [ main ]
    paths:
      - 'frontend/**'
      - 'shared/**' 
  workflow_dispatch: #

jobs:
  build-and-test: 
    runs-on: ubuntu-latest

    steps: 
      - name: CHeckout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci
      
      - name: Build Shared Types
        run: npm run build:shared

      - name: Lint
        run: npm run lint:frontend 

      - name: Test
        run: npm run test:vue --reporter=verbose

      - name: Build
        run: npm run build --workspace=frontend
        env:
          NODE_ENV: production

      - name: Upload Results
        uses: actions/upload-artifact@v7
        if: always()
        with: 
          name: test-results
          path: | 
            frontend/dist/
            frontend/coverage/
